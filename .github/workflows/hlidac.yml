name: Hlídač letenek Ryanair

on:
  schedule:
    - cron: "17 5,11,17 * * *"   # 3x denně (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zkontrolovat cenu
        env:
          CENOVY_LIMIT: ${{ vars.CENOVY_LIMIT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hlidac.py
      - name: Uložit historii cen
        run: |
          git config user.name "hlidac-bot"
          git config user.email "hlidac-bot@users.noreply.github.com"
          git add data/historie.json || true
          git diff --cached --quiet || git commit -m "Aktualizace cen letenek"
          git push
